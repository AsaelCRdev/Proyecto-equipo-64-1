<article class="movie-modal">
  <header class="movie-header">
    <div>
      <h2 class="movie-title">{{ movie()?.title }}</h2>
      <div class="movie-sub">{{ movie()?.genre }} · {{ movie()?.released }}</div>
    </div>
    <button class="close-btn" aria-label="Cerrar">✕</button>
  </header>

  <section class="movie-main">
    <div class="left">
      <img class="poster" [src]="movie()?.poster" alt="{{ movie()?.title }}" />
    </div>

    <div class="right">
      <div class="meta-row">
        <span class="badge">{{ movie()?.genre }}</span>
        <span class="year">{{ movie()?.released }}</span>
      </div>

      <div class="rating-row">
        <span class="stars">★ {{ movie()?.rating ?? '-' }}</span>
      </div>

      <div class="price-box">
        <div>Precio de alquiler</div>
        <div class="price">{{ movie()?.price ? ('$' + movie()?.price) : '-' }}</div>
      </div>

      <h4>Sinopsis</h4>
      <p class="description">{{ movie()?.plot }}</p>

      <div class="status-row">Estado: <span class="status">{{ status }}</span></div>

    </div>
  </section>

    <app-reviews-section
      [movieId]="movie()?.imdbID"
      [reviews]="movie()?.reviews"
    ></app-reviews-section>
</article>
