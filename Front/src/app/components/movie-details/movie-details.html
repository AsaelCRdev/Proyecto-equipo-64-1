<article>
  <img [src]="movie()?.poster" />
  <h2>{{ movie()?.title }}</h2>
  <span>{{ movie()?.genre }}</span>
  <span>Rating: {{ movie()?.rating }}</span>
  <span>Release date: {{ movie()?.released }}</span>
  <span>{{ movie()?.price }}$</span>
  <h4>Plot</h4>
  <span>{{ movie()?.plot }}</span>
  <span>Status: {{ status }}</span>
</article>
