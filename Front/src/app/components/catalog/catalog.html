<section class="catalog-container">
  <h2>Catálogo de Películas</h2>

  <!-- Barra de búsqueda -->
  <input
    type="search"
    placeholder="Buscar películas..."
    [formControl]="searchControl"
    class="search-input"
  />

  <!-- Lista de géneros -->
  <section class="genres-filter">
    @for (genre of genres; track $index) {
      <button
        [class.selected]="genre === selectedGenre"
        (click)="onGenreSelect(genre)"
        class="genre-btn"
        type="button"
      >
        {{ genre }}
      </button>
    }
  </section>

  <!-- Total de películas filtradas -->
  <section class="movies-count">
    {{ filteredMovies.length }} película{{ filteredMovies.length !== 1 ? 's' : '' }}
  </section>

  <!-- Lista de tarjetas de películas -->
  <section class="movies-grid">
    @for (movie of filteredMovies; track $index) {
      <a [routerLink]="['/movie', movie.imdbID]">
        <app-movie-card
          [movie]="movie"
          (showRentalModal)="onShowRentalModal($event)"
        ></app-movie-card>
      </a>
    }
  </section>

  <!-- Modal de Alquiler -->
  @if (showRentalModal) {
    <app-alquiler-dias [movie]="selectedMovieForRental" (close)="onCloseRentalModal()">
    </app-alquiler-dias>
  }
</section>
