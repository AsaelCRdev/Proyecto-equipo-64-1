<div class="overlay">
  <div class="dialog">
    <button class="close-btn" (click)="onClose()">×</button>
    <h3>Detalle de Película</h3>

    <div class="card-info">
      <img [src]="movie.imageUrl" alt="{{movie.title}}">
      <div class="info">
        <div class="title">{{movie.title}}</div>
        <div class="meta">{{movie.genre}} · {{movie.year}}</div>
        <p class="desc">Establece stock y precio de alquiler</p>
      </div>
    </div>

    <div class="form-row two">
      <div>
        <label>Stock Inicial</label>
        <input type="number" [(ngModel)]="stock" min="0" />
      </div>
      <div>
        <label>Precio de Alquiler ($)</label>
        <input type="number" [(ngModel)]="price" step="0.01" min="0" />
      </div>
    </div>

    <div class="summary">
      <p>Resumen: Agregarás <strong>{{stock}}</strong> copias de <strong>{{movie.title}}</strong> con precio de <strong>${{price.toFixed(2)}}</strong>.</p>
    </div>

    <div class="actions">
      <button class="btn" (click)="onClose()">Cancelar</button>
      <button class="btn secondary" (click)="onClose()">Cambiar Película</button>
      <button class="btn primary" (click)="onAdd()">Agregar al Catálogo</button>
    </div>
  </div>
</div>
