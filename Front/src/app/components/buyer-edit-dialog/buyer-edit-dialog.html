<div class="overlay">
  <div class="dialog">
    <form [formGroup]="authForm" class="buyer-form">
      <div class="form-row">
        <label for="email">Correo Electrónico</label>
        <input
          class="form-input"
          type="email"
          id="email"
          name="email"
          placeholder="tu@email.com"
          formControlName="email"
          required
        />
      </div>

      <div class="form-row two-columns">
        <div class="col">
          <label for="password">Contraseña</label>
          <input class="form-input" type="text" id="password" name="password" formControlName="password" required />
        </div>
        <div class="col">
          <label for="name">Nombre</label>
          <input
            class="form-input"
            type="text"
            id="name"
            name="name"
            placeholder="Carlos"
            formControlName="name"
            required
          />
        </div>
      </div>

      <div class="form-row two-columns">
        <div class="col">
          <label for="direccion">Dirección</label>
          <input
            class="form-input"
            type="text"
            id="direccion"
            name="direccion"
            placeholder="Tu dirección"
            formControlName="direction"
            required
          />
        </div>
        <div class="col">
          <label for="phone">Telefono</label>
          <input
            class="form-input"
            type="text"
            id="phone"
            name="phone"
            placeholder="Tu Telefono"
            formControlName="phone"
            required
          />
        </div>
      </div>

      <div class="actions">
        <button class="btn" (click)="onClose()">Cancelar</button>
        <button class="btn primary submit-btn" [disabled]="!isFormValid()" (click)="onEditBuyer()">
          confirmar
        </button>
      </div>
    </form>
  </div>
</div>
