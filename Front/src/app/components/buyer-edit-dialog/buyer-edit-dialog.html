<div class="overlay">
  <div class="dialog">
    <form [formGroup]="authForm">
      <label for="email">Correo Electrónico</label>
      <input
        type="email"
        id="email"
        name="email"
        placeholder="tu@email.com"
        formControlName="email"
        required
      />

      <label for="password">Contraseña</label>
      <input type="text" id="password" name="password" formControlName="password" required />
      <label for="name">Nombre</label>
      <input
        type="text"
        id="name"
        name="name"
        placeholder="Carlos"
        formControlName="name"
        required
      />
      <label for="direccion">Dirección</label>
      <input
        type="text"
        id="direccion"
        name="direccion"
        placeholder="Tu dirección"
        formControlName="direction"
        required
      />
      <label for="phone">Telefono</label>
      <input
        type="text"
        id="phone"
        name="phone"
        placeholder="Tu Telefono"
        formControlName="phone"
        required
      />
      <div class="actions">
        <button class="btn" (click)="onClose()">Cancelar</button>
        <button class="btn primary submit-btn" [disabled]="!isFormValid()" (click)="onEditBuyer()">
          confirmar
        </button>
      </div>
    </form>
  </div>
</div>
