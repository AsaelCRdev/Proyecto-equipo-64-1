<div class="overlay">
  <div class="dialog">
    <button class="close-btn" aria-label="Cerrar" (click)="onClose()">×</button>
    <header>
      <i class="fas fa-film dialog-icon"></i>
      <h1>MoviesGo</h1>
      <p>Tu plataforma de alquiler de películas</p>
    </header>

    <nav class="tab-nav">
      <button [class.active]="isLoginMode" (click)="isLoginMode=true" type="button">Iniciar Sesión</button>
      <button [class.active]="!isLoginMode" (click)="isLoginMode=false" type="button">Crear Cuenta</button>
    </nav>

    <form (ngSubmit)="onSubmit()" #authForm="ngForm" class="auth-form">
      <label for="email">Correo Electrónico</label>
      <input 
        type="email" id="email" name="email" placeholder="tu@email.com"
        [(ngModel)]="email"
        required
      />

      <label for="password">Contraseña</label>
      <input 
        type="password" id="password" name="password" placeholder="••••••••" 
        [(ngModel)]="password"
        required
      />

      <!-- Campo Dirección sólo visible en Crear Cuenta -->
      <div *ngIf="!isLoginMode">
        <label for="direccion">Dirección</label>
        <input 
          type="text" id="direccion" name="direccion" placeholder="Tu dirección" 
          [(ngModel)]="direction" 
          required
        />
        <label for="phone">Telefono</label>
        <input 
          type="text" id="phone" name="phone" placeholder="Tu Telefono"
          [(ngModel)]="phone" 
          required
        />
      </div>

      <!-- Recordarme sólo visible en Iniciar Sesión -->
      <div class="options-row" *ngIf="isLoginMode">
        <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
      </div>

      <button class="submit-btn" [disabled]="!authForm.form.valid" type="submit">
        {{isLoginMode ? 'Iniciar Sesión' : 'Crear Cuenta'}}
      </button>
    </form>

  </div>
</div>
