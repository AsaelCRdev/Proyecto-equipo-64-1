<div class="overlay">
  <div class="dialog">
    <button class="close-btn" aria-label="Cerrar" (click)="onClose()">×</button>
    <header>
      <i class="fas fa-film dialog-icon"></i>
      <h1>MoviesGo</h1>
      <p>Tu plataforma de alquiler de películas</p>
    </header>

    <nav class="tab-nav">
      <button [class.active]="isLoginMode" (click)="isLoginMode = true" type="button">
        Iniciar Sesión
      </button>
      <button [class.active]="!isLoginMode" (click)="isLoginMode = false" type="button">
        Crear Cuenta
      </button>
    </nav>

    <form [formGroup]="authForm" (ngSubmit)="onSubmit()" class="auth-form">
      <label for="email">Correo Electrónico</label>
      <input
        type="email"
        id="email"
        name="email"
        placeholder="tu@email.com"
        formControlName="email"
        required
      />

      <label for="password">Contraseña</label>
      <input
        type="password"
        id="password"
        name="password"
        placeholder="••••••••"
        formControlName="password"
        required
      />

      <!-- Recordarme sólo visible en Iniciar Sesión -->
      @if (isLoginMode) {
        <!-- Campo Dirección sólo visible en Crear Cuenta -->
      } @else {
        <div>
          <label for="name">Nombre</label>
          <input
            type="text"
            id="name"
            name="name"
            placeholder="Carlos"
            formControlName="name"
            required
          />
          <label for="direccion">Dirección</label>
          <input
            type="text"
            id="direccion"
            name="direccion"
            placeholder="Tu dirección"
            formControlName="direction"
            required
          />
          <label for="phone">Telefono</label>
          <input
            type="text"
            id="phone"
            name="phone"
            placeholder="Tu Telefono"
            formControlName="phone"
            required
          />
        </div>
      }

      <button class="submit-btn" [disabled]="!isFormValid()" type="submit">
        {{ isLoginMode ? 'Iniciar Sesión' : 'Crear Cuenta' }}
      </button>
    </form>
  </div>
</div>
