<div class="cart-overlay" [class.open]="isOpen$ | async" (click)="closeCarrito()"></div>

<aside class="cart-panel" [class.open]="isOpen$ | async" role="dialog" aria-labelledby="cart-title">
  <header>
    <h2 id="cart-title">Tu carrito</h2>
    <button (click)="closeCarrito()">Cerrar</button>
  </header>

  <div class="cart-items">
    @if (!cartItems || cartItems.length === 0) {
      <p>El carrito está vacío.</p>
    }

    @if (cartItems && cartItems.length) {
      <ul>
        @for (item of cartItems; track item.movieId) {
          <li>
            {{ item.movieTitle ?? '' }} — {{ item.days }} x {{ item.price | currency }}
            <button (click)="eliminarItem(item.movieId)">Eliminar</button>
          </li>
        }
      </ul>
    }
  </div>

  <footer>
    <button (click)="checkout()" [disabled]="!cartItems?.length">Pagar</button>
  </footer>
</aside>
